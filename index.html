<!doctype html>
<html lang="zh-CN">

<title>电商真实经营调查 Agent · Web Demo</title>
<style>
:root{
  --primary:#fe2c55;
  --bg:#161823;
  --bg-nav:#060716;
  --bg-elev:#252632;
  --bg-elev-2:#2f303d;
  --bg-hover:rgba(255,255,255,.08);
  --text:#fff;
  --text-1:rgba(255,255,255,.9);

  --warning:#ff851d;
  --cyan:#25f4ee;
  --nav-w:160px;
  --header-h:56px;
  --r-sm:8px;
  --r-md:12px;
  --r-lg:16px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);font-family:var(--font);color:var(--text)}
body{min-width:1024px;overflow-x:hidden} button,input{font:inherit} button{color:inherit} svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.web-shell{min-height:100vh;background:var(--bg)}
.tabbar{position:fixed;z-index:60;left:0;top:0;bottom:0;width:var(--nav-w);padding:16px 12px 18px;background:var(--bg-nav);border-right:1px solid rgba(255,255,255,.04);display:flex;flex-direction:column;gap:6px}
.tabbar:before{content:"真实经营调查";height:42px;display:flex;align-items:center;padding:0 12px 12px;font-size:18px;font-weight:700;letter-spacing:.2px;color:#fff;border-bottom:1px solid rgba(255,255,255,.05);margin-bottom:10px}
.tab{height:44px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 12px;color:var(--text-3);cursor:pointer;transition:.16s ease;font-size:15px;font-weight:500;text-align:left}
.tab:hover{background:var(--bg-hover);color:var(--text-1)} .tab.active{background:rgba(255,255,255,.12);color:#fff;font-weight:600}.tab svg{width:22px;height:22px;flex:none}.tab span{white-space:nowrap}
.web-topbar{position:fixed;z-index:55;left:var(--nav-w);right:0;top:0;height:var(--header-h);display:flex;align-items:center;padding:0 24px;background:rgba(22,24,35,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.web-topbar-inner{width:100%;display:grid;grid-template-columns:minmax(280px,560px) 1fr auto;align-items:center;gap:20px}
.web-search{height:40px;border-radius:12px;background:rgba(255,255,255,.08);display:flex;align-items:center;overflow:hidden;border:1px solid transparent;transition:.16s}.web-search:focus-within{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.1)}
.web-search input{flex:1;height:100%;border:0;outline:0;background:transparent;color:#fff;padding:0 14px;font-size:14px}.web-search input::placeholder{color:var(--text-4)}
.web-search button{width:72px;height:32px;margin-right:4px;border:0;border-radius:9px;background:rgba(255,255,255,.09);color:var(--text-1);cursor:pointer}.web-search button:hover{background:rgba(255,255,255,.14)}
.topbar-meta{justify-self:end;display:flex;align-items:center;gap:8px}.topbar-pill{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:transparent;color:var(--text-2);font-size:13px;display:flex;align-items:center}.topbar-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#2b2d3a,#4a4c5d);display:grid;place-items:center;font-weight:700;font-size:13px}
.stage{position:relative;margin-left:var(--nav-w);padding-top:var(--header-h);min-height:100vh;background:var(--bg);width:calc(100% - var(--nav-w));max-width:none;box-shadow:none;overflow:visible}
.page{display:none;min-height:calc(100vh - var(--header-h));opacity:0;transition:opacity .15s ease}.page.active{display:block;opacity:1}.page.is-leaving{opacity:0}
.toast{position:fixed;z-index:100;left:calc(var(--nav-w) + (100vw - var(--nav-w))/2);bottom:34px;transform:translate(-50%,12px);padding:10px 16px;border-radius:999px;background:#2f3035;color:#fff;font-size:14px;box-shadow:0 8px 32px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.btn-primary,.btn-ghost{height:42px;border-radius:8px;padding:0 20px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}.btn-primary{border:0;background:var(--primary);color:#fff}.btn-primary:hover{background:#d21b46}.btn-primary:active{background:#a50e37}.btn-ghost{border:1px solid var(--line-2);background:rgba(255,255,255,.04);color:var(--text-1)}.btn-ghost:hover{background:var(--bg-hover)}
/* home */
.home-shell{min-height:calc(100vh - var(--header-h));background:var(--bg)}
.home-content{max-width:1180px;margin:0 auto;padding:42px 40px 120px}
.hero-card{background:transparent;padding:26px 0 8px;max-width:930px}.hero-kicker{font-size:14px;color:var(--primary);font-weight:600;margin-bottom:14px}.hero-card h1{margin:0;font-size:42px;line-height:1.18;letter-spacing:-1px;font-weight:700;color:#fff}.hero-card p{margin:16px 0 0;color:var(--text-3);font-size:16px;line-height:1.7}
.query-box{margin-top:28px;width:min(760px,100%);background:var(--bg-elev);border-radius:16px;padding:10px 12px 12px;border:1px solid rgba(255,255,255,.06);box-shadow:0 10px 40px rgba(0,0,0,.16)}

.query-input-row{height:48px;display:flex;align-items:center;gap:10px}.query-input-row>svg{width:20px;height:20px;color:var(--text-3);margin-left:4px}.query-input-row input{flex:1;border:0;outline:0;background:transparent;color:#fff;font-size:16px}.query-input-row input::placeholder{color:var(--text-4)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding-top:9px;border-top:1px solid var(--line)}.chip{border:0;border-radius:8px;background:rgba(255,255,255,.06);color:var(--text-3);font-size:12px;padding:7px 10px;cursor:pointer}.chip:hover{background:rgba(255,255,255,.1);color:var(--text-1)}
.insight-marquee{margin-top:38px;width:100%;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);padding:4px 0}.insight-track{display:flex;width:max-content;gap:10px;animation:ticker 35s linear infinite}.insight-marquee:hover .insight-track{animation-play-state:paused}.insight-tag{flex:none;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text-2);font-size:13px}.insight-tag.hot{color:#ff9db0;background:rgba(254,44,85,.08);border-color:rgba(254,44,85,.18)}@keyframes ticker{to{transform:translateX(-50%)}}
.home-cta{max-width:1180px;margin:0 auto;padding:0 40px 40px;display:flex;align-items:center;gap:14px}.home-cta .btn-primary{min-width:150px}.disclaimer{color:var(--text-4);font-size:12px}
/* history */
.history-shell{max-width:1180px;margin:0 auto;padding:34px 40px 70px}.history-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px}.history-header h1{font-size:28px;margin:0 0 8px}.history-header p{margin:0;color:var(--text-3);font-size:14px}.history-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.history-card{border:1px solid var(--line);background:var(--bg-elev);border-radius:14px;padding:0;text-align:left;overflow:hidden;cursor:pointer;transition:.18s}.history-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.16);background:#292a36;box-shadow:0 12px 32px rgba(0,0,0,.22)}
.shop-head{display:flex;align-items:center;gap:12px;padding:18px}.shop-avatar{width:44px;height:44px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-weight:800}.shop-meta{flex:1;min-width:0}.shop-name{font-size:16px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shop-sub{font-size:12px;color:var(--text-4);margin-top:5px}.history-enter{font-size:13px;color:#ff8099}.history-meta{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.history-cell{padding:14px 16px;min-width:0}.history-cell+ .history-cell{border-left:1px solid var(--line)}.history-cell span{display:block;font-size:12px;color:var(--text-4);margin-bottom:7px}.history-cell b{font-size:13px;font-weight:600;color:var(--text-1)}.history-cell .history-risk{color:#ff6c88}.history-foot{padding:12px 16px;display:flex;justify-content:space-between;color:var(--text-4);font-size:12px}
/* flow */
.flow-page{position:relative;height:calc(100vh - var(--header-h));overflow:hidden;background:var(--bg)}
.flow-header{position:absolute;z-index:20;left:0;right:0;top:0;height:64px;background:rgba(22,24,35,.96);border-bottom:1px solid var(--line);display:flex;align-items:flex-end}.progress-line{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.05)}.progress-line span{display:block;height:100%;background:var(--primary);transition:.25s}
.flow-toprow{width:100%;height:62px;display:flex;align-items:center;padding:0 24px;gap:12px}.flow-back{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--text-2);display:grid;place-items:center;cursor:pointer}.flow-back:hover{background:var(--bg-hover);color:#fff}.flow-back svg{width:20px}.flow-search{height:36px;min-width:260px;max-width:480px;flex:1;border-radius:10px;background:rgba(255,255,255,.08);display:flex;align-items:center;padding:0 14px;color:var(--text-2);font-size:13px}.flow-step{font-size:12px;color:var(--text-4);white-space:nowrap}
.flow-scroller{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;padding-top:64px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}.module-screen{min-height:calc(100vh - var(--header-h) - 64px);scroll-snap-align:start;position:relative;padding:54px max(110px,calc((100vw - var(--nav-w) - 980px)/2)) 70px;display:flex;flex-direction:column;justify-content:center}.module-screen:before{content:"";position:absolute;inset:22px max(70px,calc((100vw - var(--nav-w) - 1060px)/2));border:1px solid var(--line);border-radius:16px;pointer-events:none}.module-kicker,.module-title,.conclusion-line,.fact-list,.source-row,.generate-wrap{position:relative;z-index:1;max-width:860px}.module-kicker{font-size:12px;color:var(--text-4);letter-spacing:.6px}.module-title{margin:8px 0 12px;font-size:34px;line-height:1.2}.conclusion-line{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-bottom:22px}.risk-dot{width:8px;height:8px;border-radius:50%;background:currentColor}.level-high{color:#ff5475}.level-medium{color:#ff9c42}.level-normal{color:#43d680}
.fact-list{display:grid;gap:10px}.fact-card,.rating-card,.timeline,.chain-flow,.legal-grid{background:var(--bg-elev);border:1px solid var(--line);border-radius:12px}.fact-card{padding:15px 16px;color:var(--text-1);font-size:14px;line-height:1.65}.fact-card strong{display:block;margin-bottom:6px}.rating-card{padding:4px 16px}.rating-row{min-height:48px;display:grid;grid-template-columns:110px 50px 1fr;align-items:center;border-bottom:1px solid var(--line)}.rating-row:last-child{border:0}.rating-name{font-size:13px;color:var(--text-3)}.rating-score{font-size:14px;font-weight:600}.stars{display:flex;gap:3px}.star{width:15px;height:15px;color:rgba(255,255,255,.18)}.star.on{color:var(--primary);fill:var(--primary)}
.timeline{padding:8px 16px}.timeline-item{position:relative;display:grid;grid-template-columns:90px 1fr;gap:18px;padding:14px 0 14px 22px;border-bottom:1px solid var(--line)}.timeline-item:last-child{border:0}.timeline-item:before{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.14)}.timeline-node{position:absolute;left:0;top:20px;width:9px;height:9px;border-radius:50%;background:var(--primary);z-index:2}.timeline-node.debt{background:var(--cyan)}.timeline-date{font-size:12px;color:var(--text-4)}.timeline-text{font-size:14px;color:var(--text-1)}
.chain-flow{padding:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.chain-node{padding:12px;border-radius:8px;background:rgba(255,255,255,.05);font-size:13px;text-align:center;color:var(--text-2)}.legal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);overflow:hidden}.legal-block{background:var(--bg-elev);padding:16px}.legal-block b{display:block;font-size:12px;color:var(--text-4);margin-bottom:8px}.legal-block span{font-size:14px;line-height:1.6;color:var(--text-1)}
.source-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:18px}.source-prefix{font-size:12px;color:var(--text-4)}.source-chip{padding:5px 9px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--text-3);font-size:11px}.generate-wrap{margin-top:18px}.action-rail{position:absolute;z-index:4;right:max(88px,calc((100vw - var(--nav-w) - 1020px)/2));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}.rail-action{width:50px;border:0;background:transparent;color:var(--text-3);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}.rail-icon{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;transition:.15s}.rail-icon svg{width:18px;height:18px}.rail-action:hover .rail-icon{background:rgba(255,255,255,.14);color:#fff}.rail-action.saved .rail-icon{background:rgba(254,44,85,.14);color:var(--primary)}.rail-label{font-size:11px}.reveal{opacity:0;transform:translateY(12px)}.module-screen.play .reveal{animation:reveal .38s ease forwards}.module-screen.play .reveal:nth-of-type(2){animation-delay:.08s}.module-screen.play .reveal:nth-of-type(3){animation-delay:.16s}@keyframes reveal{to{opacity:1;transform:none}}
/* report */
.live-analysis{grid-column:1/-1;border:1px solid rgba(37,244,238,.24);background:linear-gradient(140deg,rgba(37,244,238,.06),rgba(254,44,85,.04));border-radius:14px;padding:18px}.live-analysis-note{font-size:12px;color:var(--text-3);line-height:1.6;margin:-4px 0 14px}.live-finding{border-top:1px solid var(--line);padding:14px 0}.live-finding:first-of-type{border-top:0}.live-finding h3{font-size:14px;margin:0 0 8px;display:flex;gap:9px;align-items:center}.live-finding p{font-size:13px;line-height:1.65;color:var(--text-2);margin:6px 0}.live-finding blockquote{margin:7px 0;padding:8px 10px;border-left:2px solid var(--cyan);background:rgba(255,255,255,.035);font-size:12px;line-height:1.6;color:var(--text-3);white-space:pre-wrap}.live-status{font-size:11px;color:var(--text-4)}.live-analysis + .score-hero{border-style:dashed}.live-analysis + .score-hero:before{content:"以下为固定合成案例参考，不属于本次材料分析";display:block;margin-bottom:12px;color:var(--text-4);font-size:12px}
.report-shell{min-height:calc(100vh - var(--header-h));background:var(--bg)}.report-header{height:74px;max-width:1180px;margin:0 auto;padding:0 40px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.report-header h1{font-size:24px;margin:0}.report-badge{padding:5px 8px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--text-3);font-size:11px}.report-content{max-width:1180px;margin:0 auto;padding:24px 40px 110px;display:grid;grid-template-columns:1.08fr .92fr;gap:16px;align-items:start}.score-hero{grid-column:1/-1;background:var(--bg-elev);border:1px solid var(--line);border-radius:16px;padding:24px}.score-top{display:flex;align-items:center;gap:26px}.score-ring{width:146px;height:146px;position:relative;flex:none}.score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}.score-ring circle{fill:none;stroke-width:8}.ring-bg{stroke:rgba(255,255,255,.08)}.ring-value{stroke:var(--primary);stroke-dasharray:263.89;stroke-dashoffset:97.64;stroke-linecap:round}.score-center{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:46px}.score-number{font-size:42px;font-weight:700}.score-unit{font-size:13px;color:var(--text-4);margin-left:4px}.score-summary{max-width:520px}.score-label{font-size:12px;color:var(--text-4)}.score-grade{font-size:28px;font-weight:700;margin-top:7px}.score-desc{font-size:14px;line-height:1.65;color:var(--text-3);margin-top:9px}.score-logic{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.score-logic-title{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}.score-logic-note{font-size:11px;color:var(--text-4);font-weight:400}.score-row{background:rgba(255,255,255,.04);padding:12px;border-radius:8px}.score-row-name{display:block;font-size:11px;color:var(--text-4);margin-bottom:6px}.score-row b{font-size:16px}.insider-rules{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}.insider-rule{padding:10px;border-radius:8px;background:rgba(254,44,85,.07);color:#ff9aae;font-size:12px;line-height:1.5}.insider-rule strong{color:#fff}.report-banner,.section-card{background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;padding:18px}.report-banner{grid-column:1/-1}.banner-main{display:flex;align-items:center;gap:8px;color:#ff6684;font-size:16px;font-weight:600}.banner-sub{margin-top:8px;font-size:12px;color:var(--text-4)}.section-title{font-size:15px;font-weight:600;margin-bottom:14px}.overview-row{width:100%;height:50px;border:0;border-top:1px solid var(--line);background:transparent;display:grid;grid-template-columns:42px 1fr auto;align-items:center;text-align:left;cursor:pointer;color:inherit}.overview-row:first-of-type{border-top:0}.overview-row:hover{background:rgba(255,255,255,.04)}.overview-no{font-size:11px;color:var(--text-4)}.overview-name{font-size:13px}.overview-status{font-size:12px}.report-timeline .timeline{border:0;background:transparent;padding:0}.evidence-chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.evidence-node{padding:9px 10px;border-radius:7px;background:rgba(255,255,255,.06);font-size:12px;color:var(--text-2)}.evidence-node:last-child{color:#ff7790}.evidence-arrow svg{width:16px;height:16px;color:var(--text-4)}.next-list{display:grid;gap:10px}.next-item{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text-2)}.next-square{width:6px;height:6px;border-radius:2px;background:var(--primary)}.report-actions{position:fixed;z-index:30;right:24px;bottom:24px;display:flex;gap:8px;padding:8px;border-radius:12px;background:rgba(37,38,50,.92);border:1px solid var(--line);backdrop-filter:blur(12px)}
@media(max-width:1180px){.history-list{grid-template-columns:1fr}.report-content{grid-template-columns:1fr}.score-hero,.report-banner{grid-column:1}.module-screen{padding-left:80px;padding-right:120px}.module-screen:before{left:46px;right:70px}.action-rail{right:82px}}
.full-width{grid-column:1/-1}.table-scroll{max-width:100%;overflow-x:auto}.check-table{width:100%;border-collapse:collapse;font-size:12px;line-height:1.55;color:var(--text-2)}.check-table th,.check-table td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:120px}.check-table th{color:var(--text-4);font-weight:600}.check-table td:first-child,.check-table th:first-child{min-width:90px;white-space:nowrap}.check-list{margin:0;padding-left:20px;display:grid;gap:9px;color:var(--text-2);font-size:13px;line-height:1.6}.small-note{margin-top:10px;color:var(--text-4);font-size:11px;line-height:1.65}.rating-note{font-size:11px;color:var(--text-4)}.rating-row{grid-template-columns:110px 50px 1fr}.classification-list{display:grid;gap:10px}.classification-item{display:grid;gap:5px;padding:12px;border-radius:9px;background:rgba(255,255,255,.04);font-size:13px;line-height:1.6}.classification-item strong{color:var(--text-1)}.classification-item span{color:var(--text-3)}

    }
    if (m.timeline) {
      return `<div class="fact-list reveal"><div class="timeline">${m.timeline.map(t => `<div class="timeline-item"><span class="timeline-node ${t.debt ? 'debt' : ''}"></span><span class="timeline-date">${t.date}</span><span class="timeline-text">${t.text}</span></div>`).join('')}</div></div>`;

      return `<div class="fact-list reveal"><div class="chain-flow">${m.chain.map(x => `<div class="chain-node">${x}</div>`).join('')}</div>${m.facts.map(f => `<div class="fact-card">${f}</div>`).join('')}</div>`;
    }

      return `<div class="fact-list reveal"><div class="legal-grid">

      </div></div>`;
    }
    const facts = (m.facts || []).map(f => `<div class="fact-card">${f}</div>`).join('');
    const next = (m.next || []).length ? `<div class="fact-card"><strong>下一步调查方向</strong>${m.next.join(' / ')}</div>` : '';

            <p class="small-note">证据缺失时不补编事实。合成数据只能作为 QA fixture 的预期输入，不能作为现实调查事实。</p>

            <div class="next-list">${next.map(x => `<div class="next-item"><span class="next-square"></span><span>${x}</span></div>`).join('')}</div>

          </section>
        </div>
        <div class="report-actions">

    document.querySelectorAll('[data-jump]').forEach(btn => btn.addEventListener('click', () => {
      currentFlowIndex = Number(btn.dataset.jump);
      flowView = 'detail';
      renderFlow();
      location.hash = '#/flow';
      setTimeout(() => scrollToModule(currentFlowIndex, false), 80);
    }));
    document.querySelector('#export-report').addEventListener('click', () => showToast('演示版暂不支持导出'));
    document.querySelector('#restart').addEventListener('click', () => location.hash = '#/home');
  }

  function route() {
    const key = (location.hash || '#/home').replace('#/', '');
    const safe = pages[key] ? key : 'home';
    Object.entries(pages).forEach(([name, node]) => node.classList.toggle('active', name === safe));
    tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.route === `#/${safe}`));
    if (safe === 'flow' && flowView === 'detail') setTimeout(() => scrollToModule(currentFlowIndex, false), 40);
  }

  tabs.forEach(tab => tab.addEventListener('click', () => {
    if (tab.dataset.route === '#/flow') {
      flowView = 'history';
      renderFlow();
    }
    location.hash = tab.dataset.route;
  }));

  renderHome();
  renderFlow();
  renderReport();
  window.addEventListener('hashchange', route);
  if (!location.hash) location.hash = '#/home'; else route();
})();

</script>
<script>
(() => {
  const input=document.querySelector('#global-search-input');
  const btn=document.querySelector('#global-search-btn');
  function go(){
    const v=input.value.trim();
    location.hash='#/home';
    setTimeout(()=>{
      const home=document.querySelector('#query-input');
      if(home && v){home.value=v; home.focus();}
    },30);
  }
  btn.addEventListener('click',go);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
})();
</script>
